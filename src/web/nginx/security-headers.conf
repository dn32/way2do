# Cabeçalhos de segurança (escopo, seção 10). Incluído em cada location que define add_header próprio: no nginx, um
# add_header dentro de um location descarta os herdados do server.
# CSP sem nada inline: o React escapa o conteúdo e a CSP é a segunda barreira contra XSS. O Service Worker é
# registrado por módulo (sem script inline), e os dados vêm de /api, na mesma origem.
add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; object-src 'none'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
